## File Naming Conventions

### Recommended Format

`{category}-{number}.md`

**Examples**:
- `task-001.md`
- `review-financial-report.md`
- `email-draft-client-response.md`

### Constraints

- Lowercase only
- Alphanumeric + hyphens
- No spaces (use hyphens)
- Max 100 characters
- Must end with `.md`

### Pattern

```regex
^[a-z0-9-]{1,96}\.md$
```

---

## Status Transitions

### Valid Transitions

```
inbox → needs_action → done
```

### Folder Mapping

| Status | Folder | Description |
|--------|--------|-------------|
| `inbox` | `Inbox/` | New tasks awaiting processing |
| `needs_action` | `Needs_Action/` | Tasks currently being processed |
| `done` | `Done/` | Completed tasks |

### Transition Rules

1. Tasks start in `inbox` status
2. System moves to `needs_action` when detected
3. System moves to `done` after processing
4. Manual moves are allowed but logged
5. Status field must match folder location

